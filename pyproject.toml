[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-exit-kit"
version = "0.1.0"
description = "Read-only CLI and agent skills for preparing EVM wallet exits. Does not sign or broadcast."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exitkit = "exitkit.cli:main"

[project.urls]
Homepage = "https://gitlab.com/aa22396584/wallet-exit-kit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["exitkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
